 Ul=[{question:`Qu’est-ce qui occupe le plus ton attention en ce moment ?`,helper:`Choisis la réponse qui ressemble le plus à ton vécu actuel.`,answers:[{label:`Trop de possibilités, difficile de choisir`,focus:`clarity`},{label:`Une idée que j’aimerais enfin mettre en mouvement`,focus:`momentum`},{label:`Un rythme qui manque de stabilité`,focus:`grounding`},{label:`Un besoin de ralentir et de récupérer`,focus:`rest`}]},{question:`Quand tu dois prendre une décision, qu’est-ce qui t’aiderait le plus ?`,helper:`Il n’y a pas de réponse correcte ou attendue.`,answers:[{label:`Voir plus clairement les options`,focus:`clarity`},{label:`Faire un petit essai concret`,focus:`momentum`},{label:`Revenir à mes priorités et contraintes`,focus:`grounding`},{label:`Me donner du temps avant de choisir`,focus:`rest`}]},{question:`Quel changement te ferait le plus de bien cette semaine ?`,helper:`Pense à un changement réaliste, pas idéal.`,answers:[{label:`Clarifier ce qui compte vraiment`,focus:`clarity`},{label:`Terminer une première étape`,focus:`momentum`},{label:`Installer une habitude soutenable`,focus:`grounding`},{label:`Retirer une obligation secondaire`,focus:`rest`}]},{question:`Face à une tâche qui te paraît grande, que fais-tu souvent ?`,helper:`Observe sans te juger.`,answers:[{label:`Je cherche d’abord à comprendre par où commencer`,focus:`clarity`},{label:`Je commence vite, puis j’ajuste en avançant`,focus:`momentum`},{label:`Je la découpe en étapes et je planifie`,focus:`grounding`},{label:`Je repousse si mes ressources sont basses`,focus:`rest`}]},{question:`Quel soutien aimerais-tu pouvoir demander ?`,helper:`Le soutien peut être concret, relationnel ou simplement du temps.`,answers:[{label:`Un échange pour ordonner mes idées`,focus:`clarity`},{label:`Un partenaire pour franchir le premier pas`,focus:`momentum`},{label:`Un cadre ou une routine plus fiable`,focus:`grounding`},{label:`Un peu d’espace sans devoir me justifier`,focus:`rest`}]},{question:`À la fin de cette semaine, tu aimerais surtout pouvoir te dire…`,helper:`Ta réponse aide à choisir un parcours de réflexion temporaire.`,answers:[{label:`Je sais mieux ce qui compte.`,focus:`clarity`},{label:`J’ai fait un premier pas.`,focus:`momentum`},{label:`J’ai trouvé un rythme qui tient.`,focus:`grounding`},{label:`Je me suis laissé·e de la marge.`,focus:`rest`}]}],Wl={clarity:{name:`Clarté`,title:`Distinguer l’essentiel du bruit`,prompt:`Qu’est-ce que tu sais déjà, même si tout n’est pas encore décidé ?`,plan:[`Nommer ce qui compte`,`Séparer faits et hypothèses`,`Réduire les options`,`Poser une question utile`,`Demander un regard extérieur`,`Choisir une expérience`,`Faire un bilan sans jugement`]},momentum:{name:`Élan`,title:`Transformer l’envie en premier pas`,prompt:`Quel geste assez petit pourrais-tu vraiment commencer aujourd’hui ?`,plan:[`Définir le premier pas`,`Préparer les conditions`,`Commencer pendant dix minutes`,`Repérer ce qui aide`,`Ajuster l’échelle`,`Partager l’avancement`,`Choisir la suite`]},grounding:{name:`Ancrage`,title:`Trouver un rythme qui tient`,prompt:`Quel repère existant pourrait soutenir cette intention ?`,plan:[`Observer ton rythme`,`Choisir un repère`,`Alléger une friction`,`Prévoir une pause`,`Répéter sans perfection`,`Demander du soutien`,`Garder ce qui fonctionne`]},rest:{name:`Repos`,title:`Faire une place à la récupération`,prompt:`Qu’est-ce que tu peux déposer, même temporairement ?`,plan:[`Nommer une limite`,`Dégager dix minutes`,`Ralentir une tâche`,`Écouter un besoin`,`Reporter une obligation`,`Accepter un soutien`,`Choisir une reprise douce`]}},Gl=[{id:`patrimoine-vivant`,label:`VODÚN · PATRIMOINE VIVANT`,title:`Une tradition vivante se transmet avec ses communautés.`,excerpt:`Ce que le cadre de l’UNESCO dit du patrimoine immatériel — et pourquoi une application ne parle pas à la place des communautés.`,body:[`La Convention de l’UNESCO de 2003 définit le patrimoine culturel immatériel à partir de pratiques, expressions, connaissances et savoir-faire que des communautés, groupes ou personnes reconnaissent comme faisant partie de leur patrimoine. Elle souligne leur transmission entre générations et leur recréation continue.`,`Dans une décision du 11 juin 2025, le Bureau de l’UNESCO a approuvé une aide préparatoire demandée par le Bénin pour préparer un dossier de candidature intitulé « Vodun, croyances, pratiques sociales et modes de vie ». Cette décision porte sur la préparation d’une candidature : elle ne constitue pas, à elle seule, une inscription sur la Liste représentative.`,`Le dossier décrit une préparation avec consultation et participation de communautés concernées, ainsi que la recherche de leur consentement libre, préalable et éclairé. Ce cadre décrit ce dossier précis ; il ne vaut pas autorisation générale pour une application de résumer toutes les traditions.`,`Pour AYÉ, cela signifie qu’une fiche doit rendre visibles ses sources, préciser ce qu’elles permettent d’affirmer et signaler ses limites. Elle ne remplace ni une transmission communautaire ni une démarche religieuse.`],tags:[`Bénin`,`Transmission`,`3 min`],sources:[{title:`UNESCO — Convention de 2003, article 2`,reference:`Texte de la Convention pour la sauvegarde du patrimoine culturel immatériel.`,url:`https://ich.unesco.org/en/convention`},{title:`UNESCO — Decision of the Bureau 20.COM 3.BUR 4.2`,reference:`11 juin 2025. Aide préparatoire au Bénin pour la préparation d’un dossier de candidature sur le Vodun.`,url:`https://ich.unesco.org/en/decisions-bureau/20.COM%203.BUR/4.2`}],contentType:`Documentaire · aucune prescription`},{id:`pluralite-des-contextes`,label:`VODÚN · CONTEXTES ET HISTOIRES`,title:`Parler du Vodún sans effacer les lieux.`,excerpt:`Des recherches situées autour de la côte du Bénin décrivent des échanges régionaux et transnationaux, pas une tradition uniforme.`,body:[`Le livre de l’anthropologue Dana Rush prend Ouidah comme point de départ et situe son enquête dans un espace qui s’étend au Togo et au Ghana. La présentation de l’éditeur évoque des circulations d’histoires, d’idées et de formes religieuses. C’est le résumé d’un travail situé, pas une carte exhaustive des communautés du Golfe du Bénin.`,`Dans un article de 2015, Timothy R. Landry étudie comment des praticiens béninois participent à un paysage religieux en changement et comment certaines formes de savoir sont reformulées dans des contextes contemporains, notamment transnationaux. La page éditeur consultée fournit le résumé ; le texte complet peut demander un accès institutionnel.`,`Ces références invitent à nommer un lieu, une période, une source et un point de vue. Elles ne justifient pas de projeter une observation locale sur tout le Bénin, ni de traiter les pratiques béninoises, togolaises et diasporiques comme interchangeables.`,`Cette fiche est une introduction documentaire. Elle ne prescrit aucune pratique et ne prétend pas représenter la parole des personnes qui pratiquent le Vodún.`],tags:[`Recherche`,`Golfe du Bénin`,`3 min`],sources:[{title:`Dana Rush — Vodun in Coastal Benin: Unfinished, Open-Ended, Global`,reference:`Vanderbilt University Press, 2017. Présentation éditoriale et périmètre de recherche.`,url:`https://www.vanderbiltuniversitypress.com/9780826519085/vodun-in-coastal-benin/`},{title:`Timothy R. Landry — “Vodún, Globalization, and the Creative Layering of Belief in Southern Bénin”`,reference:`Journal of Religion in Africa, 45(2), 2015, p. 170–199. Résumé et notice bibliographique.`,url:`https://brill.com/view/journals/jra/45/2/article-p170_4.xml?language=en`}],contentType:`Documentaire · contexte situé`},{id:`noms-et-orthographes`,label:`VODÚN · MOTS ET CONTEXTES`,title:`Vodu, Vodún, Vodou : les noms situent aussi les récits.`,excerpt:`Les publications emploient différentes graphies selon les contextes. Une orthographe ne suffit pas à rendre des traditions identiques.`,body:[`La notice éditoriale du recueil Spirit Service emploie plusieurs formes — notamment Vodu, Vodún et Vodou — en les situant dans des contextes géographiques différents. Le volume rassemble des chapitres distincts sur le Vodún béninois, des traditions au Togo et le Vodou haïtien.`,`Cette présentation est celle d’un ouvrage collectif, pas un dictionnaire universel des usages. Elle rappelle qu’un même mot écrit de plusieurs façons peut renvoyer à des histoires, des communautés et des pratiques qui ne se confondent pas.`,`Règle éditoriale d’AYÉ : reprendre autant que possible la graphie utilisée par la source ou la communauté citée, nommer le lieu et la période, et ne pas fabriquer d’équivalence entre le Vodún du Bénin et des traditions de la diaspora.`],tags:[`Vocabulaire`,`Diasporas`,`2 min`],sources:[{title:`Eric James Montgomery, Timothy R. Landry et Christian N. Vannier (dir.) — Spirit Service: Vodún and Vodou in the African Atlantic World`,reference:`Indiana University Press, 2022. Présentation et table des matières du recueil collectif.`,url:`https://iupress.org/9780253061911/spirit-service/`}],contentType:`Documentaire · terminologie contextualisée`}],Kl=Object.freeze({publicCount:Gl.length,draftsInReview:0,status:`published`,message:`Trois fiches documentaires contextualisées sont publiées avec leurs sources et limites visibles. Elles ne prescrivent aucune pratique.`}),ql=[{id:`date-et-tradition`,label:`Ligne éditoriale AYÉ`,title:`Une date peut ouvrir une réflexion, pas une appartenance.`,excerpt:`Pourquoi AYÉ ne déduit jamais une identité ou une relation religieuse d’un signe astrologique.`,body:[`Les repères de naissance peuvent servir de supports symboliques de connaissance de soi. Ils ne permettent pas à une application de déclarer quelle est la tradition, l’appartenance ou la relation au sacré d’une personne.`,`Astrologie occidentale, numérologie et ressources documentaires sur le Vodún sont des systèmes distincts. AYÉ affiche séparément une correspondance symbolique de produit lorsque son référentiel versionné est activé ; elle ne devient pas pour autant un fait de tradition.`,`Une correspondance symbolique AYÉ n’est ni une attribution traditionnelle issue du Fa ou d’une lignée, ni une consultation religieuse. AYÉ ne prescrit aucun interdit cultuel.`],tags:[`Contexte`,`Libre arbitre`,`2 min`]},{id:`lecture-symbolique`,label:`Mode d’emploi`,title:`Une grille de lecture, pas une preuve.`,excerpt:`L’astrologie et la numérologie peuvent aider à formuler une question ; elles ne décident pas à ta place.`,body:[`AYÉ présente l’astrologie occidentale et la numérologie comme des grilles symboliques. Leur intérêt ici est d’aider à formuler une question, observer une préférence ou essayer une action.`,`Chaque calcul affiche sa convention et sa version. D’autres écoles peuvent appliquer des variantes ; une interprétation n’est ni un diagnostic ni une preuve scientifique.`,`Tu peux garder une piste, la modifier ou la laisser de côté. Aucune lecture n’est une consigne médicale, financière, professionnelle ou religieuse.`],tags:[`Méthode`,`Numérologie`,`3 min`]},{id:`source-dabord`,label:`Méthode éditoriale`,title:`La source avant le symbole.`,excerpt:`Une fiche culturelle ne sera publiée qu’avec son contexte, ses sources et une validation éditoriale.`,body:[`Une affirmation tirée d’un ouvrage, une interprétation d’auteur et une analogie contemporaine ne sont pas la même chose. AYÉ vise à rendre ces statuts visibles.`,`Pour chaque contenu relatif au Vodún du Golfe du Bénin, AYÉ affiche les sources, le contexte, la portée et les limites. Une correspondance symbolique créée pour le produit reste distincte d’un fait de tradition.`,`Les fiches documentaires publiées sont des introductions sourcées, non des prescriptions. Aucun rituel sensible ni aucune consultation du Fa n’est simulé dans l’application.`],tags:[`Édition`,`Sources`,`2 min`]},{id:`interdits-et-vigilance`,label:`Repère de prudence`,title:`Une date ne crée pas un interdit religieux.`,excerpt:`AYÉ ne transforme pas une lecture astrologique en tabou cultuel ni en ordre de conduite.`,body:[`Les recommandations issues de l’astrologie populaire ne sont pas des interdits du Fa ni des règles universelles de pratique religieuse.`,`Cette version n’attribue aucun interdit à une date, à un signe ou à un nombre. La rubrique demandée reste à cadrer éditorialement ; aucune prescription religieuse ne sera calculée.`,`Une consultation religieuse, une transmission et une interprétation personnelle ne sont pas des fonctions qu’une application peut simuler.`],tags:[`Limites`,`Confiance`,`2 min`]},{id:`confidentialite`,label:`Compte et données`,title:`Une démo qui distingue aperçu et compte.`,excerpt:`Les calculs peuvent être consultés avant inscription ; les notes ne sont jamais des diagnostics.`,body:[`L’aperçu public calcule les repères dans le navigateur. Le mode démo public ne crée pas de compte et n’envoie pas la date saisie à un serveur.`,`La version full-stack de test permet de créer un compte et utilise une base SQLite. Elle n’est pas un service de production : évite d’y saisir des confidences très sensibles.`,`Avant une ouverture à de vrais utilisateurs, AYÉ devra finaliser la politique de confidentialité, la base persistante, les sauvegardes et une revue de sécurité.`],tags:[`Vie privée`,`Démo`,`2 min`]}],Jl={1:{title:`L’initiative consciente`,summary:`Ouvrir une voie sans devoir tout porter seul·e. Une lecture symbolique du 1 met l’accent sur le départ, le choix et l’autonomie.`,resource:`Tu peux être à l’aise quand il faut commencer, décider ou donner une forme à une idée encore floue. L’autonomie te nourrit davantage lorsqu’elle s’accompagne d’un cap choisi.`,reflection:`L’envie d’avancer vite peut rendre l’aide des autres moins visible. Observe si tu prends tout en charge avant même de demander un appui.`,careers:[`Autonomie avec des objectifs lisibles`,`Lancement de projets`,`Création et direction`,`Entrepreneuriat à tester`],question:`Dans quel domaine pourrais-tu initier quelque chose sans avoir à tout contrôler ?`},2:{title:`La coopération qui garde sa voix`,summary:`Créer des liens sans t’effacer. La coopération est une piste à vérifier dans tes relations et tes choix de travail.`,resource:`Tu peux repérer les nuances, écouter plusieurs points de vue et améliorer une coopération. Cette qualité est plus solide quand tes propres besoins restent dans la conversation.`,reflection:`À force d’attendre que tout le monde soit d’accord, une décision peut rester en suspens. Vérifie si tu cherches une validation alors que tu sais déjà ce qui te convient.`,careers:[`Partenariats et médiation`,`Recherche utilisateur`,`Coordination`,`Équipes où l’écoute est valorisée`],question:`Quelle préférence pourrais-tu exprimer clairement, sans l’enrober d’excuses ?`},3:{title:`L’expression qui prend forme`,summary:`Donner une forme partageable à tes idées et créer un fil qui va au-delà du premier élan.`,resource:`La parole, l’écriture, l’image ou la mise en récit peuvent t’aider à relier des personnes et des idées. Ton expression gagne en force lorsqu’elle rencontre un cadre simple.`,reflection:`La variété peut attirer ton attention dans plusieurs directions. Observe les projets que tu repousses parce que leur première version ne ressemble pas encore à ton idée idéale.`,careers:[`Communication et création de contenu`,`Pédagogie et transmission`,`Design et culture`,`Projets avec une marge d’expression`],question:`Quelle idée gagnerait à être partagée dans une version imparfaite mais réelle ?`},4:{title:`La structure qui rend libre`,summary:`Construire des appuis fiables pour rendre le mouvement possible, sans confondre structure et rigidité.`,resource:`Tu peux aimer clarifier les étapes, organiser les ressources et transformer une intention en méthode. Une bonne structure doit surtout servir ce qui compte.`,reflection:`La prudence peut se transformer en attente de conditions parfaites. Un petit test réversible peut parfois remplacer une longue préparation.`,careers:[`Opérations et organisation`,`Métiers techniques ou de précision`,`Gestion de projet`,`Cadres où qualité et continuité comptent`],question:`Quelle structure t’aide vraiment — et laquelle est devenue une règle sans raison ?`},5:{title:`Le mouvement avec un fil rouge`,summary:`Explorer sans te disperser : préserver le besoin de découverte tout en choisissant un fil rouge.`,resource:`La curiosité et l’adaptation peuvent t’aider à naviguer dans le changement. Tu peux apprendre en testant et en reliant des univers différents.`,reflection:`Une nouvelle possibilité peut sembler plus vivante que ce que tu as déjà commencé. Regarde ce que tu pourrais ajuster sans tout abandonner.`,careers:[`Environnements variés et évolutifs`,`Communication ou développement commercial`,`Recherche de terrain`,`Rôles transverses à tester`],question:`Quelle nouveauté peux-tu explorer sans renoncer à ton engagement actuel ?`},6:{title:`Le soin avec des frontières`,summary:`Contribuer sans devenir responsable de tout le monde ; le soin peut prendre plusieurs formes.`,resource:`Tu peux remarquer ce qui aide un groupe ou un lieu à mieux fonctionner. Écouter, concevoir, enseigner ou organiser peuvent tous être des façons de contribuer.`,reflection:`Le désir d’être utile peut pousser à accepter une charge qui ne t’appartient pas. Vérifie si tu aides par choix ou par peur de décevoir.`,careers:[`Éducation et expérience utilisateur`,`Coordination ou accompagnement`,`Design de services`,`Équipes attentives à l’impact humain`],question:`À quoi veux-tu contribuer — et quelle limite rend cette contribution durable ?`},7:{title:`La profondeur reliée au monde`,summary:`Approfondir et rendre la compréhension partageable, sans attendre de tout savoir pour agir.`,resource:`Tu peux apprécier les questions complexes, l’analyse et le temps nécessaire pour comprendre. Une période de recul devient féconde quand elle débouche sur une idée ou une expérience.`,reflection:`Il est tentant d’attendre de tout comprendre avant d’agir. Observe si ta recherche apporte de nouvelles informations ou retarde une expérience simple.`,careers:[`Recherche et analyse`,`Écriture ou documentation`,`Stratégie et expertise`,`Temps de concentration protégé`],question:`Quelle question peux-tu éclairer par un test concret plutôt que par une nouvelle recherche ?`},8:{title:`La responsabilité qui ne réduit pas ta valeur`,summary:`Faire grandir une ambition au service de tes valeurs, sans mesurer toute ta valeur à tes résultats.`,resource:`Tu peux être motivé·e par la réalisation, la négociation et la capacité à mobiliser des ressources. Ton impact augmente lorsque tu définis aussi le coût acceptable de la réussite.`,reflection:`Un statut, un chiffre ou une validation peut prendre trop de place. Demande-toi si l’objectif mérite encore les efforts qu’il exige.`,careers:[`Pilotage et développement d’activité`,`Gestion de ressources`,`Négociation ou stratégie`,`Responsabilités avec des critères sains`],question:`Quel indicateur de réussite aimerais-tu ajouter, au-delà du résultat visible ?`},9:{title:`La contribution avec discernement`,summary:`Choisir une cause, une œuvre ou une transmission à laquelle contribuer durablement, sans se demander de sauver tout le monde.`,resource:`Tu peux être touché·e par les enjeux communs et les récits qui relient des expériences. La perspective d’ensemble devient féconde quand elle s’appuie sur des gestes concrets.`,reflection:`L’idéal peut rendre le quotidien décevant. Repère aussi les améliorations modestes qui ont déjà un effet réel.`,careers:[`Culture et transmission`,`Projets à impact social`,`Éducation ou communication`,`Travail collectif orienté vers un sens partagé`],question:`Quelle contribution est à ta portée cette semaine, sans dépasser tes ressources ?`},11:{title:`La vision traduite en gestes`,summary:`Dans la convention AYÉ v1, le 11 est conservé comme nombre maître : une grille symbolique, pas une capacité surnaturelle.`,resource:`Tu peux être sensible aux idées émergentes et aux détails porteurs de sens. Les traduire en mots, création ou expérience vérifiable aide à les partager.`,reflection:`Une grande sensibilité peut donner à chaque impression le poids d’une certitude. Reviens aux faits observables et confronte ton interprétation avec d’autres points de vue.`,careers:[`Écriture, création ou conception`,`Facilitation et transmission`,`Recherche d’idées et innovation`,`Environnements où la réflexion a sa place`],question:`Quelle intuition peux-tu transformer en question testable plutôt qu’en conclusion ?`},22:{title:`La vision construite à bonne échelle`,summary:`Dans la convention AYÉ v1, le 22 est conservé ; il ne garantit ni réussite ni grandeur.`,resource:`Tu peux aimer faire le lien entre une vision et ses conditions concrètes : ressources, étapes, personnes et continuité.`,reflection:`L’échelle d’un projet peut devenir écrasante ou pousser au perfectionnisme. Réduis le prochain pas jusqu’à ce qu’il soit faisable.`,careers:[`Conception de systèmes et de produits`,`Opérations et projets complexes`,`Entrepreneuriat à impact à tester`,`Responsabilités partagées`],question:`Quelle partie de ton projet peut être construite cette semaine, sans attendre l’ensemble ?`},33:{title:`La transmission sans sacrifice de soi`,summary:`Le 33 est conservé dans la convention AYÉ v1 comme choix symbolique, pas comme obligation de servir.`,resource:`Tu peux aimer transmettre, soutenir l’apprentissage ou améliorer l’expérience d’un groupe. Une contribution juste respecte aussi tes limites.`,reflection:`Le rôle de personne ressource peut devenir une charge invisible. Remarque quand tu offres une aide que personne ne t’a demandée.`,careers:[`Pédagogie et accompagnement professionnel`,`Conception de services`,`Création collective`,`Transmission avec limites explicites`],question:`Qu’aimerais-tu transmettre, et dans quelles conditions veux-tu le faire ?`}};function Yl(e){return Jl[e]||Jl[1]}var Xl=`vodun-cour-symbolique-vod_00-v1.0.0`,Zl=Object.freeze({file:`vod_00.pdf`,title:`Essai comparatiste Vodouns tutélaires du Bénin × anges zodiacaux × astrologie populaire occidentale`,edition:`édition enrichie`,method:`Correspondances symboliques [SYN] croisées avec le signe solaire du zodiaque tropical occidental.`,limitation:`Le document précise qu’il ne s’agit ni d’une attribution traditionnelle béninoise, ni d’une détermination par date de naissance, ni d’une consultation du Fa. Il s’agit d’un rapprochement comparatiste propre à cet essai.`,secondaryNote:`« Secondaire » reprend le classement de l’essai uniquement ; ce n’est pas un rang rituel ou religieux.`,angelNote:`Les archanges sont repris séparément du volet Vodún comme repères issus de la tradition ésotérique occidentale Agrippa/Barrett ; ils ne sont pas une attribution religieuse universelle ou personnelle.`}),Ql=Object.freeze({Bélier:{glyph:`♈`,archange:`Malchidael`,voduns:[{name:`Gu`,secondary:!1,rationale:`Convergence Mars/guerre ↔ fer/guerre ; Feu de la forge ↔ Feu cardinal du signe.`},{name:`Hêviosso`,secondary:!1,rationale:`L’action fulgurante de la foudre évoque l’impulsivité et la rapidité d’action du signe.`},{name:`Legba`,secondary:!0,rationale:`« Premier invoqué » dans le rituel, en écho à la fonction d’initiateur ou de pionnier du premier signe.`}]},Taureau:{glyph:`♉`,archange:`Asmodel`,voduns:[{name:`Sakpata`,secondary:!1,rationale:`Correspondance élémentaire directe proposée : Terre ↔ Terre.`},{name:`Loko`,secondary:!1,rationale:`L’enracinement profond évoque la stabilité du signe.`},{name:`Dan`,secondary:!0,rationale:`L’accumulation de richesse fait écho à la sensualité vénusienne ; le rapprochement est indiqué comme plus fragile, Dan relevant davantage de l’Eau et du mouvement que de la Terre fixe.`}]},Gémeaux:{glyph:`♊`,archange:`Ambriel`,voduns:[{name:`Legba`,secondary:!1,rationale:`Convergence Mercure/communication ↔ Legba, messager universel.`},{name:`Hohovi`,secondary:!1,rationale:`Analogie de dualité et de gémellité ; l’essai la dit fragile, car surtout conceptuelle plutôt que fonctionnelle.`},{name:`Dan`,secondary:!0,rationale:`De rares représentations bicéphales évoquent la dualité ; rapprochement signalé comme le plus fragile du groupe.`}]},Cancer:{glyph:`♋`,archange:`Muriel`,voduns:[{name:`Mawu (au sein de Mawu-Lissa)`,secondary:!1,rationale:`L’essai relève la place explicitement lunaire et maternelle de Mawu dans la cosmogonie fon.`},{name:`Tôhôssou`,secondary:!1,rationale:`Le lien à l’eau et à la petite enfance fait écho au registre maternel ; le document rappelle que les circonstances de naissance, et non le calendrier, relèvent de la logique traditionnelle de cette figure.`},{name:`Agbê`,secondary:!0,rationale:`Élément Eau partagé, mais fonction plus souveraine que maternelle ; l’essai classe ce rapprochement comme le plus faible des trois.`}]},Lion:{glyph:`♌`,archange:`Verchiel`,voduns:[{name:`Lissa (au sein de Mawu-Lissa)`,secondary:!1,rationale:`Le principe solaire explicite de la cosmogonie fon est mis en miroir du Soleil, repère du signe.`},{name:`Hêviosso`,secondary:!1,rationale:`La dimension royale d’Hêviosso fait écho à la souveraineté symbolique du signe.`},{name:`Gu`,secondary:!0,rationale:`Le fer, attribut historique du pouvoir royal, est proposé comme résonance secondaire avec la puissance du signe.`}]},Vierge:{glyph:`♍`,archange:`Hamaliel`,voduns:[{name:`Loko`,secondary:!1,rationale:`Le soin et le service communautaire font écho au sens du service associé à Mercure.`},{name:`Sakpata`,secondary:!1,rationale:`La dimension de soin et de guérison mentionnée dans l’essai fait écho au souci de précision et de santé attribué au signe.`},{name:`Minona`,secondary:!0,rationale:`L’ordre domestique fait écho à la méticulosité ; l’essai souligne que la documentation sur Minona est plus éparse et que ce rapprochement reste fragile.`}]},Balance:{glyph:`♎`,archange:`Zuriel`,voduns:[{name:`Mawu-Lissa (couple entier)`,secondary:!1,rationale:`L’union de deux principes opposés est mise en écho avec la fonction d’harmonie du signe.`},{name:`Legba`,secondary:!1,rationale:`La médiation des relations humaines fait écho à la recherche d’harmonie relationnelle du signe.`},{name:`Dan`,secondary:!0,rationale:`L’image du serpent maintenant l’équilibre cosmique entre terre et océan ; l’essai précise que Dan n’est pas intrinsèquement lié à la justice ou à l’Air.`}]},Scorpion:{glyph:`♏`,archange:`Barbiel`,voduns:[{name:`Tôhôssou`,secondary:!1,rationale:`Résonance avec le mystère et la dimension hors-norme attribués au signe ; la logique traditionnelle liée aux circonstances de naissance reste distincte du calendrier.`},{name:`Dan`,secondary:!1,rationale:`La mue du serpent est rapprochée de la transformation et de la renaissance.`},{name:`Sakpata`,secondary:!0,rationale:`Maladie, mort et guérison sont rapprochées de l’idée de passage ; l’essai qualifie le rapprochement de plus éloigné, Sakpata relevant principalement de la Terre.`}]},Sagittaire:{glyph:`♐`,archange:`Adnachiel`,voduns:[{name:`Hêviosso`,secondary:!1,rationale:`Convergence Jupiter/justice ↔ justice associée à la foudre ; l’essai la compte parmi ses correspondances les plus solides.`},{name:`Gu`,secondary:!1,rationale:`L’ouverture des chemins fait écho au mouvement et à l’exploration.`},{name:`Agbê`,secondary:!0,rationale:`L’horizon maritime évoque l’ouverture ; l’essai signale un rapprochement élémentairement plus éloigné, Eau plutôt que Feu.`}]},Capricorne:{glyph:`♑`,archange:`Hanael`,voduns:[{name:`Nana Buluku`,secondary:!1,rationale:`Saturne, la structure et le temps long sont rapprochés du rôle ancestral attribué à Nana Buluku ; l’essai fragilise ce lien en raison d’incertitudes documentaires sur l’entité.`},{name:`Sakpata`,secondary:!1,rationale:`L’autorité terrienne ancienne et la justice lente font écho à la structure saturnienne.`},{name:`Loko`,secondary:!0,rationale:`L’image de l’arbre ancestral traversant les générations fait écho au rapport du signe au temps long.`}]},Verseau:{glyph:`♒`,archange:`Cambiel`,voduns:[{name:`Legba`,secondary:
