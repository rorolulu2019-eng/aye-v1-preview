 à ton vécu actuel.`,answers:[{label:`Trop de possibilités, difficile de choisir`,focus:`clarity`},{label:`Une idée que j’aimerais enfin mettre en mouvement`,focus:`momentum`},{label:`Un rythme qui manque de stabilité`,focus:`grounding`},{label:`Un besoin de ralentir et de récupérer`,focus:`rest`}]},{question:`Quand tu dois prendre une décision, qu’est-ce qui t’aiderait le plus ?`,helper:`Il n’y a pas de réponse correcte ou attendue.`,answers:[{label:`Voir plus clairement les options`,focus:`clarity`},{label:`Faire un petit essai concret`,focus:`momentum`},{label:`Revenir à mes priorités et contraintes`,focus:`grounding`},{label:`Me donner du temps avant de choisir`,focus:`rest`}]},{question:`Quel changement te ferait le plus de bien cette semaine ?`,helper:`Pense à un changement réaliste, pas idéal.`,answers:[{label:`Clarifier ce qui compte vraiment`,focus:`clarity`},{label:`Terminer une première étape`,focus:`momentum`},{label:`Installer une habitude soutenable`,focus:`grounding`},{label:`Retirer une obligation secondaire`,focus:`rest`}]},{question:`Face à une tâche qui te paraît grande, que fais-tu souvent ?`,helper:`Observe sans te juger.`,answers:[{label:`Je cherche d’abord à comprendre par où commencer`,focus:`clarity`},{label:`Je commence vite, puis j’ajuste en avançant`,focus:`momentum`},{label:`Je la découpe en étapes et je planifie`,focus:`grounding`},{label:`Je repousse si mes ressources sont basses`,focus:`rest`}]},{question:`Quel soutien aimerais-tu pouvoir demander ?`,helper:`Le soutien peut être concret, relationnel ou simplement du temps.`,answers:[{label:`Un échange pour ordonner mes idées`,focus:`clarity`},{label:`Un partenaire pour franchir le premier pas`,focus:`momentum`},{label:`Un cadre ou une routine plus fiable`,focus:`grounding`},{label:`Un peu d’espace sans devoir me justifier`,focus:`rest`}]},{question:`À la fin de cette semaine, tu aimerais surtout pouvoir te dire…`,helper:`Ta réponse aide à choisir un parcours de réflexion temporaire.`,answers:[{label:`Je sais mieux ce qui compte.`,focus:`clarity`},{label:`J’ai fait un premier pas.`,focus:`momentum`},{label:`J’ai trouvé un rythme qui tient.`,focus:`grounding`},{label:`Je me suis laissé·e de la marge.`,focus:`rest`}]}],Hl={clarity:{name:`Clarté`,title:`Distinguer l’essentiel du bruit`,prompt:`Qu’est-ce que tu sais déjà, même si tout n’est pas encore décidé ?`,plan:[`Nommer ce qui compte`,`Séparer faits et hypothèses`,`Réduire les options`,`Poser une question utile`,`Demander un regard extérieur`,`Choisir une expérience`,`Faire un bilan sans jugement`]},momentum:{name:`Élan`,title:`Transformer l’envie en premier pas`,prompt:`Quel geste assez petit pourrais-tu vraiment commencer aujourd’hui ?`,plan:[`Définir le premier pas`,`Préparer les conditions`,`Commencer pendant dix minutes`,`Repérer ce qui aide`,`Ajuster l’échelle`,`Partager l’avancement`,`Choisir la suite`]},grounding:{name:`Ancrage`,title:`Trouver un rythme qui tient`,prompt:`Quel repère existant pourrait soutenir cette intention ?`,plan:[`Observer ton rythme`,`Choisir un repère`,`Alléger une friction`,`Prévoir une pause`,`Répéter sans perfection`,`Demander du soutien`,`Garder ce qui fonctionne`]},rest:{name:`Repos`,title:`Faire une place à la récupération`,prompt:`Qu’est-ce que tu peux déposer, même temporairement ?`,plan:[`Nommer une limite`,`Dégager dix minutes`,`Ralentir une tâche`,`Écouter un besoin`,`Reporter une obligation`,`Accepter un soutien`,`Choisir une reprise douce`]}},Ul=[{id:`patrimoine-vivant`,label:`VODÚN · PATRIMOINE VIVANT`,title:`Une tradition vivante se transmet avec ses communautés.`,excerpt:`Ce que le cadre de l’UNESCO dit du patrimoine immatériel — et pourquoi une application ne parle pas à la place des communautés.`,body:[`La Convention de l’UNESCO de 2003 définit le patrimoine culturel immatériel à partir de pratiques, expressions, connaissances et savoir-faire que des communautés, groupes ou personnes reconnaissent comme faisant partie de leur patrimoine. Elle souligne leur transmission entre générations et leur recréation continue.`,`Dans une décision du 11 juin 2025, le Bureau de l’UNESCO a approuvé une aide préparatoire demandée par le Bénin pour préparer un dossier de candidature intitulé « Vodun, croyances, pratiques sociales et modes de vie ». Cette décision porte sur la préparation d’une candidature : elle ne constitue pas, à elle seule, une inscription sur la Liste représentative.`,`Le dossier décrit une préparation avec consultation et participation de communautés concernées, ainsi que la recherche de leur consentement libre, préalable et éclairé. Ce cadre décrit ce dossier précis ; il ne vaut pas autorisation générale pour une application de résumer toutes les traditions.`,`Pour AYÉ, cela signifie qu’une fiche doit rendre visibles ses sources, préciser ce qu’elles permettent d’affirmer et signaler ses limites. Elle ne remplace ni une transmission communautaire ni une démarche religieuse.`],tags:[`Bénin`,`Transmission`,`3 min`],sources:[{title:`UNESCO — Convention de 2003, article 2`,reference:`Texte de la Convention pour la sauvegarde du patrimoine culturel immatériel.`,url:`https://ich.unesco.org/en/convention`},{title:`UNESCO — Decision of the Bureau 20.COM 3.BUR 4.2`,reference:`11 juin 2025. Aide préparatoire au Bénin pour la préparation d’un dossier de candidature sur le Vodun.`,url:`https://ich.unesco.org/en/decisions-bureau/20.COM%203.BUR/4.2`}],contentType:`Documentaire · aucune prescription`},{id:`pluralite-des-contextes`,label:`VODÚN · CONTEXTES ET HISTOIRES`,title:`Parler du Vodún sans effacer les lieux.`,excerpt:`Des recherches situées autour de la côte du Bénin décrivent des échanges régionaux et transnationaux, pas une tradition uniforme.`,body:[`Le livre de l’anthropologue Dana Rush prend Ouidah comme point de départ et situe son enquête dans un espace qui s’étend au Togo et au Ghana. La présentation de l’éditeur évoque des circulations d’histoires, d’idées et de formes religieuses. C’est le résumé d’un travail situé, pas une carte exhaustive des communautés du Golfe du Bénin.`,`Dans un article de 2015, Timothy R. Landry étudie comment des praticiens béninois participent à un paysage religieux en changement et comment certaines formes de savoir sont reformulées dans des contextes contemporains, notamment transnationaux. La page éditeur consultée fournit le résumé ; le texte complet peut demander un accès institutionnel.`,`Ces références invitent à nommer un lieu, une période, une source et un point de vue. Elles ne justifient pas de projeter une observation locale sur tout le Bénin, ni de traiter les pratiques béninoises, togolaises et diasporiques comme interchangeables.`,`Cette fiche est une introduction documentaire. Elle ne prescrit aucune pratique et ne prétend pas représenter la parole des personnes qui pratiquent le Vodún.`],tags:[`Recherche`,`Golfe du Bénin`,`3 min`],sources:[{title:`Dana Rush — Vodun in Coastal Benin: Unfinished, Open-Ended, Global`,reference:`Vanderbilt University Press, 2017. Présentation éditoriale et périmètre de recherche.`,url:`https://www.vanderbiltuniversitypress.com/9780826519085/vodun-in-coastal-benin/`},{title:`Timothy R. Landry — “Vodún, Globalization, and the Creative Layering of Belief in Southern Bénin”`,reference:`Journal of Religion in Africa, 45(2), 2015, p. 170–199. Résumé et notice bibliographique.`,url:`https://brill.com/view/journals/jra/45/2/article-p170_4.xml?language=en`}],contentType:`Documentaire · contexte situé`},{id:`noms-et-orthographes`,label:`VODÚN · MOTS ET CONTEXTES`,title:`Vodu, Vodún, Vodou : les noms situent aussi les récits.`,excerpt:`Les publications emploient différentes graphies selon les contextes. Une orthographe ne suffit pas à rendre des traditions identiques.`,body:[`La notice éditoriale du recueil Spirit Service emploie plusieurs formes — notamment Vodu, Vodún et Vodou — en les situant dans des contextes géographiques différents. Le volume rassemble des chapitres distincts sur le Vodún béninois, des traditions au Togo et le Vodou haïtien.`,`Cette présentation est celle d’un ouvrage collectif, pas un dictionnaire universel des usages. Elle rappelle qu’un même mot écrit de plusieurs façons peut renvoyer à des histoires, des communautés et des pratiques qui ne se confondent pas.`,`Règle éditoriale d’AYÉ : reprendre autant que possible la graphie utilisée par la source ou la communauté citée, nommer le lieu et la période, et ne pas fabriquer d’équivalence entre le Vodún du Bénin et des traditions de la diaspora.`],tags:[`Vocabulaire`,`Diasporas`,`2 min`],sources:[{title:`Eric James Montgomery, Timothy R. Landry et Christian N. Vannier (dir.) — Spirit Service: Vodún and Vodou in the African Atlantic World`,reference:`Indiana University Press, 2022. Présentation et table des matières du recueil collectif.`,url:`https://iupress.org/9780253061911/spirit-service/`}],contentType:`Documentaire · terminologie contextualisée`}],Wl=Object.freeze({publicCount:Ul.length,draftsInReview:0,status:`published`,message:`Trois fiches documentaires contextualisées sont publiées avec leurs sources et limites visibles. Elles ne prescrivent aucune pratique.`}),Gl=[{id:`date-et-tradition`,label:`Ligne éditoriale AYÉ`,title:`Une date peut ouvrir une réflexion, pas une appartenance.`,excerpt:`Pourquoi AYÉ ne déduit jamais une identité ou une relation religieuse d’un signe astrologique.`,body:[`Les repères de naissance peuvent servir de supports symboliques de connaissance de soi. Ils ne permettent pas à une application de déclarer quelle est la tradition, l’appartenance ou la relation au sacré d’une personne.`,`Astrologie occidentale, numérologie et ressources documentaires sur le Vodún sont des systèmes distincts. AYÉ affiche séparément une correspondance symbolique de produit lorsque son référentiel versionné est activé ; elle ne devient pas pour autant un fait de tradition.`,`Une correspondance symbolique AYÉ n’est ni une attribution traditionnelle issue du Fa ou d’une lignée, ni une consultation religieuse. AYÉ ne prescrit aucun interdit cultuel.`],tags:[`Contexte`,`Libre arbitre`,`2 min`]},{id:`lecture-symbolique`,label:`Mode d’emploi`,title:`Une grille de lecture, pas une preuve.`,excerpt:`L’astrologie et la numérologie peuvent aider à formuler une question ; elles ne décident pas à ta place.`,body:[`AYÉ présente l’astrologie occidentale et la numérologie comme des grilles symboliques. Leur intérêt ici est d’aider à formuler une question, observer une préférence ou essayer une action.`,`Chaque calcul affiche sa convention et sa version. D’autres écoles peuvent appliquer des variantes ; une interprétation n’est ni un diagnostic ni une preuve scientifique.`,`Tu peux garder une piste, la modifier ou la laisser de côté. Aucune lecture n’est une consigne médicale, financière, professionnelle ou religieuse.`],tags:[`Méthode`,`Numérologie`,`3 min`]},{id:`source-dabord`,label:`Méthode éditoriale`,title:`La source avant le symbole.`,excerpt:`Une fiche culturelle ne sera publiée qu’avec son contexte, ses sources et une validation éditoriale.`,body:[`Une affirmation tirée d’un ouvrage, une interprétation d’auteur et une analogie contemporaine ne sont pas la même chose. AYÉ vise à rendre ces statuts visibles.`,`Pour chaque contenu relatif au Vodún du Golfe du Bénin, AYÉ affiche les sources, le contexte, la portée et les limites. Une correspondance symbolique créée pour le produit reste distincte d’un fait de tradition.`,`Les fiches documentaires publiées sont des introductions sourcées, non des prescriptions. Aucun rituel sensible ni aucune consultation du Fa n’est simulé dans l’application.`],tags:[`Édition`,`Sources`,`2 min`]},{id:`interdits-et-vigilance`,label:`Repère de prudence`,title:`Une date ne crée pas un interdit religieux.`,excerpt:`AYÉ ne transforme pas une lecture astrologique en tabou cultuel ni en ordre de conduite.`,body:[`Les recommandations issues de l’astrologie populaire ne sont pas des interdits du Fa ni des règles universelles de pratique religieuse.`,`Cette version n’attribue aucun interdit à une date, à un signe ou à un nombre. La rubrique demandée reste à cadrer éditorialement ; aucune prescription religieuse ne sera calculée.`,`Une consultation religieuse, une transmission et une interprétation personnelle ne sont pas des fonctions qu’une application peut simuler.`],tags:[`Limites`,`Confiance`,`2 min`]},{id:`confidentialite`,label:`Compte et données`,title:`Une démo qui distingue aperçu et compte.`,excerpt:`Les calculs peuvent être consultés avant inscription ; les notes ne sont jamais des diagnostics.`,body:[`L’aperçu public calcule les repères dans le navigateur. Le mode démo public ne crée pas de compte et n’envoie pas la date saisie à un serveur.`,`La version full-stack de test permet de créer un compte et utilise une base SQLite. Elle n’est pas un service de production : évite d’y saisir des confidences très sensibles.`,`Avant une ouverture à de vrais utilisateurs, AYÉ devra finaliser la politique de confidentialité, la base persistante, les sauvegardes et une revue de sécurité.`],tags:[`Vie privée`,`Démo`,`2 min`]}],Kl=`vodun-cour-symbolique-vod_00-v1.0.0`,ql=Object.freeze({file:`vod_00.pdf`,title:`Essai comparatiste Vodouns tutélaires du Bénin × anges zodiacaux × astrologie populaire occidentale`,edition:`édition enrichie`,method:`Correspondances symboliques [SYN] croisées avec le signe solaire du zodiaque tropical occidental.`,limitation:`Le document précise qu’il ne s’agit ni d’une attribution traditionnelle béninoise, ni d’une détermination par date de naissance, ni d’une consultation du Fa. Il s’agit d’un rapprochement comparatiste propre à cet essai.`,secondaryNote:`« Secondaire » reprend le classement de l’essai uniquement ; ce n’est pas un rang rituel ou religieux.`,angelNote:`Les archanges sont repris séparément du volet Vodún comme repères issus de la tradition ésotérique occidentale Agrippa/Barrett ; ils ne sont pas une attribution religieuse universelle ou personnelle.`}),Jl=Object.freeze({Bélier:{glyph:`♈`,archange:`Malchidael`,voduns:[{name:`Gu`,secondary:!1,rationale:`Convergence Mars/guerre ↔ fer/guerre ; Feu de la forge ↔ Feu cardinal du signe.`},{name:`Hêviosso`,secondary:!1,rationale:`L’action fulgurante de la foudre évoque l’impulsivité et la rapidité d’action du signe.`},{name:`Legba`,secondary:!0,rationale:`« Premier invoqué » dans le rituel, en écho à la fonction d’initiateur ou de pionnier du premier signe.`}]},Taureau:{glyph:`♉`,archange:`Asmodel`,voduns:[{name:`Sakpata`,secondary:!1,rationale:`Correspondance élémentaire directe proposée : Terre ↔ Terre.`},{name:`Loko`,secondary:!1,rationale:`L’enracinement profond évoque la stabilité du signe.`},{name:`Dan`,secondary:!0,rationale:`L’accumulation de richesse fait écho à la sensualité vénusienne ; le rapprochement est indiqué comme plus fragile, Dan relevant davantage de l’Eau et du mouvement que de la Terre fixe.`}]},Gémeaux:{glyph:`♊`,archange:`Ambriel`,voduns:[{name:`Legba`,secondary:!1,rationale:`Convergence Mercure/communication ↔ Legba, messager universel.`},{name:`Hohovi`,secondary:!1,rationale:`Analogie de dualité et de gémellité ; l’essai la dit fragile, car surtout conceptuelle plutôt que fonctionnelle.`},{name:`Dan`,secondary:!0,rationale:`De rares représentations bicéphales évoquent la dualité ; rapprochement signalé comme le plus fragile du groupe.`}]},Cancer:{glyph:`♋`,archange:`Muriel`,voduns:[{name:`Mawu (au sein de Mawu-Lissa)`,secondary:!1,rationale:`L’essai relève la place explicitement lunaire et maternelle de Mawu dans la cosmogonie fon.`},{name:`Tôhôssou`,secondary:!1,rationale:`Le lien à l’eau et à la petite enfance fait écho au registre maternel ; le document rappelle que les circonstances de naissance, et non le calendrier, relèvent de la logique traditionnelle de cette figure.`},{name:`Agbê`,secondary:!0,rationale:`Élément Eau partagé, mais fonction plus souveraine que maternelle ; l’essai classe ce rapprochement comme le plus faible des trois.`}]},Lion:{glyph:`♌`,archange:`Verchiel`,voduns:[{name:`Lissa (au sein de Mawu-Lissa)`,secondary:!1,rationale:`Le principe solaire explicite de la cosmogonie fon est mis en miroir du Soleil, repère du signe.`},{name:`Hêviosso`,secondary:!1,rationale:`La dimension royale d’Hêviosso fait écho à la souveraineté symbolique du signe.`},{name:`Gu`,secondary:!0,rationale:`Le fer, attribut historique du pouvoir royal, est proposé comme résonance secondaire avec la puissance du signe.`}]},Vierge:{glyph:`♍`,archange:`Hamaliel`,voduns:[{name:`Loko`,secondary:!1,rationale:`Le soin et le service communautaire font écho au sens du service associé à Mercure.`},{name:`Sakpata`,secondary:!1,rationale:`La dimension de soin et de guérison mentionnée dans l’essai fait écho au souci de précision et de santé attribué au signe.`},{name:`Minona`,secondary:!0,rationale:`L’ordre domestique fait écho à la méticulosité ; l’essai souligne que la documentation sur Minona est plus éparse et que ce rapprochement reste fragile.`}]},Balance:{glyph:`♎`,archange:`Zuriel`,voduns:[{name:`Mawu-Lissa (couple entier)`,secondary:!1,rationale:`L’union de deux principes opposés est mise en écho avec la fonction d’harmonie du signe.`},{name:`Legba`,secondary:!1,rationale:`La médiation des relations humaines fait écho à la recherche d’harmonie relationnelle du signe.`},{name:`Dan`,secondary:!0,rationale:`L’image du serpent maintenant l’équilibre cosmique entre terre et océan ; l’essai précise que Dan n’est pas intrinsèquement lié à la justice ou à l’Air.`}]},Scorpion:{glyph:`♏`,archange:`Barbiel`,voduns:[{name:`Tôhôssou`,secondary:!1,rationale:`Résonance avec le mystère et la dimension hors-norme attribués au signe ; la logique traditionnelle liée aux circonstances de naissance reste distincte du calendrier.`},{name:`Dan`,secondary:!1,rationale:`La mue du serpent est rapprochée de la transformation et de la renaissance.`},{name:`Sakpata`,secondary:!0,rationale:`Maladie, mort et guérison sont rapprochées de l’idée de passage ; l’essai qualifie le rapprochement de plus éloigné, Sakpata relevant principalement de la Terre.`}]},Sagittaire:{glyph:`♐`,archange:`Adnachiel`,voduns:[{name:`Hêviosso`,secondary:!1,rationale:`Convergence Jupiter/justice ↔ justice associée à la foudre ; l’essai la compte parmi ses correspondances les plus solides.`},{name:`Gu`,secondary:!1,rationale:`L’ouverture des chemins fait écho au mouvement et à l’exploration.`},{name:`Agbê`,secondary:!0,rationale:`L’horizon maritime évoque l’ouverture ; l’essai signale un rapprochement élémentairement plus éloigné, Eau plutôt que Feu.`}]},Capricorne:{glyph:`♑`,archange:`Hanael`,voduns:[{name:`Nana Buluku`,secondary:!1,rationale:`Saturne, la structure et le temps long sont rapprochés du rôle ancestral attribué à Nana Buluku ; l’essai fragilise ce lien en raison d’incertitudes documentaires sur l’entité.`},{name:`Sakpata`,secondary:!1,rationale:`L’autorité terrienne ancienne et la justice lente font écho à la structure saturnienne.`},{name:`Loko`,secondary:!0,rationale:`L’image de l’arbre ancestral traversant les générations fait écho au rapport du signe au temps long.`}]},Verseau:{glyph:`♒`,archange:`Cambiel`,voduns:[{name:`Legba`,secondary:!1,rationale:`La figure liminale, hors des catégories fixes, est rapprochée de l’originalité ; l’essai note une cohérence selon son test de l’élément Air.`},{name:`Hohovi`,secondary:!1,rationale:`La sacralité de la différence est rapprochée du goût pour ce qui sort de la norme ; l’essai précise qu’il s’agit d’une analogie thématique, non structurelle.`},{name:`Gu`,secondary:!0,rationale:`L’innovation technique est rapprochée du goût du progrès ; l’essai signale un lien élémentaire fragile, Feu plutôt qu’Air.`}]},Poissons:{glyph:`♓`,archange:`Barchiel`,voduns:[{name:`Mawu-Lissa (couple entier)`,secondary:!1,rationale:`La totalité primordiale est mise en écho avec les Poissons comme synthèse et dissolution du cycle zodiacal.`},{name:`Tôhôssou`,secondary:!1,rationale:`Les
